<!doctype html>
<html lang="id">
  <body
    style="
      margin: 0;
      background: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #171717;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #ffffff; border-radius: 12px; padding: 32px"
          >
            <tr>
              <td style="font-size: 22px; font-weight: bold; padding-bottom: 24px">KenBike</td>
            </tr>
            <tr>
              <td style="font-size: 18px; font-weight: bold; padding-bottom: 12px">
                Atur ulang password
              </td>
            </tr>
            <tr>
              <td style="font-size: 14px; line-height: 22px; color: #404040; padding-bottom: 24px">
                Kami menerima permintaan untuk mengatur ulang password akun KenBike
                <strong>{{ .Email }}</strong>.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 24px">
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password"
                  style="
                    display: inline-block;
                    background: #171717;
                    color: #ffffff;
                    text-decoration: none;
                    font-size: 14px;
                    font-weight: bold;
                    padding: 12px 20px;
                    border-radius: 8px;
                  "
                  >Atur ulang password</a
                >
              </td>
            </tr>
            <tr>
              <td style="font-size: 12px; line-height: 18px; color: #737373">
                Jika kamu tidak meminta ini, abaikan email ini — password kamu tidak akan berubah.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
